<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Higuera · Pedidos y llamados</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f231b">
<link rel="icon" href="../img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../hg.css">
<style>
body{background:#1f231b;color:#f4f1ea;min-height:100vh}
.hide{display:none!important}
/* acceso */
.gate{position:fixed;inset:0;z-index:90;background:#1f231b;display:grid;place-items:center;padding:20px}
.gate .box{width:100%;max-width:360px;background:var(--bg);color:var(--ink);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate h1{font:400 32px/1.05 var(--serif)}
.gate p{font-size:14px;color:var(--mut)}
.gate .err{color:var(--red);font-weight:700;font-size:13.5px;min-height:18px}
.gate .in{text-align:center;font-size:24px;letter-spacing:.4em}
/* barra superior */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(31,35,27,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(244,241,234,.08)}
.bar .logo{height:24px;filter:invert(1) brightness(2)}
.bar h1{font:400 24px/1 var(--serif);white-space:nowrap}
.bar .sp{flex:1}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:rgba(244,241,234,.7)}
.pill{height:38px;padding:0 14px;border-radius:99px;background:rgba(244,241,234,.08);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:8px;color:#f4f1ea;text-decoration:none}
.pill.on{background:#f0c7a6;color:#1f231b}
.panels{display:flex;gap:6px}
.panels a{font-size:12.5px;font-weight:800;color:rgba(244,241,234,.6);text-decoration:none;padding:8px 10px;border-radius:10px}
.panels a.cur{background:rgba(244,241,234,.1);color:#f4f1ea}
/* distribución */
.lay{display:grid;grid-template-columns:1fr 360px;gap:18px;padding:18px;align-items:start}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col h2{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,241,234,.7);margin:0 4px 10px}
.col h2 b{font:600 13px var(--mono);background:rgba(244,241,234,.1);color:#f4f1ea;border-radius:99px;padding:2px 9px;letter-spacing:0}
.col .zone{display:flex;flex-direction:column;gap:12px;min-height:120px;border-radius:20px}
.none{border:1.5px dashed rgba(244,241,234,.15);border-radius:18px;padding:22px 14px;text-align:center;font-size:13px;color:rgba(244,241,234,.45)}
/* ticket */
.tk{background:#fbfaf6;color:var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 18px 30px -18px rgba(0,0,0,.7);position:relative}
.tk.new{animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
.tk .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--sage)}
.tk.c-prep .hd{background:#f6e7c8}
.tk.c-listo .hd{background:#d9efe0}
.tk .ms{font:400 30px/1 var(--serif)}
.tk .ms small{font:600 12px var(--mono);color:var(--mut);margin-left:6px}
.tk .tm{font:600 13px var(--mono);padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.7)}
.tk .tm.w{background:#f3d9a5;color:#7a4e0c}
.tk .tm.r{background:#9a3624;color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.6}}
.tk .who{font-size:12px;font-weight:800;color:var(--olive2);padding:8px 14px 0;display:flex;gap:6px;align-items:center}
.tk ul{list-style:none;padding:8px 14px 4px;border-bottom:1.5px dashed #d8d1c2}
.tk li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:6px 0;font-size:16px;font-weight:700;line-height:1.25}
.tk li .q{font:600 16px var(--mono);color:var(--terra)}
.tk li i{display:block;font-style:normal;font-weight:600;font-size:13px;color:#fff;background:var(--terra);border-radius:7px;padding:2px 7px;margin-top:4px;width:max-content;max-width:100%}
.tk .gn{margin:8px 14px 0;font-size:13px;font-weight:700;background:var(--terra-l);color:var(--terra-d);border-radius:9px;padding:7px 10px}
.tk .ac{display:flex;gap:8px;padding:12px 14px}
.tk .ac .btn{flex:1;height:48px;font-size:15px}
.tk .sm{display:flex;justify-content:space-between;padding:0 14px 12px}
.tk .sm button{font-size:12.5px;font-weight:800;color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.tk .sm button.dg{color:var(--red)}
/* llamados y mesas */
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:76px}
.box{background:rgba(244,241,234,.06);border-radius:22px;padding:16px}
.box h2{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,241,234,.7);margin-bottom:12px;display:flex;justify-content:space-between}
.call{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#f0c7a6;color:#1f231b;margin-bottom:10px;animation:ring 1.6s ease-in-out infinite}
.call.cuenta{background:#fbfaf6}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(240,199,166,.5)}50%{box-shadow:0 0 0 8px rgba(240,199,166,0)}}
.call .m{font:400 32px/1 var(--serif);min-width:54px;text-align:center}
.call .tx{flex:1;font-size:14px;font-weight:800;line-height:1.25}
.call .tx small{display:block;font-weight:600;font-size:12px;color:rgba(31,35,27,.65)}
.call .btn{height:42px;padding:0 14px;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tb{aspect-ratio:1;border-radius:14px;background:rgba(244,241,234,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#f4f1ea;position:relative;transition:transform .12s}
.tb:active{transform:scale(.96)}
.tb b{font:400 26px/1 var(--serif)}
.tb small{font-size:10.5px;font-weight:800;color:rgba(244,241,234,.6);text-transform:uppercase;letter-spacing:.06em}
.tb.oc{background:#4f5b41}
.tb.oc small{color:rgba(244,241,234,.85)}
.tb.al{background:#f0c7a6;color:#1f231b}
.tb.al small{color:#1f231b}
.tb .dt{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#e8a06d}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:rgba(244,241,234,.6);font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:rgba(244,241,234,.06);border-radius:14px;padding:12px}
.stats b{display:block;font:400 28px/1 var(--serif)}
.stats small{font-size:11.5px;color:rgba(244,241,234,.6);font-weight:700}
/* pestañas en celular */
.mtabs{display:none}
@media (max-width:1100px){.lay{grid-template-columns:1fr 320px}.cols{grid-template-columns:1fr 1fr}.cols .col:nth-child(3){grid-column:span 2}}
@media (max-width:820px){
  .bar h1{font-size:20px}.panels{display:none}#modeP,#ctxt{display:none}
  .bar{padding:12px 14px}
  .lay{grid-template-columns:1fr;padding:12px}
  .side{position:static}
  .cols{grid-template-columns:1fr}.cols .col:nth-child(3){grid-column:auto}
  .mtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px 0;position:sticky;top:61px;z-index:20;background:#1f231b}
  .mtabs button{height:42px;border-radius:12px;background:rgba(244,241,234,.07);color:#f4f1ea;font-weight:800;font-size:13.5px}
  .mtabs button.on{background:#f4f1ea;color:#1f231b}
  .mtabs b{font:600 12px var(--mono);margin-left:4px}
  body[data-mt="pedidos"] .side{display:none}
  body[data-mt="llamados"] .cols,body[data-mt="llamados"] #bxMesas,body[data-mt="llamados"] #bxStats{display:none}
  body[data-mt="mesas"] .cols,body[data-mt="mesas"] #bxCalls{display:none}
}
/* hoja de mesa */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:821px){.scrim{align-items:center}.sheet{border-radius:26px}}
.sheet h3{font:400 34px/1 var(--serif)}
.sheet .x{float:right;width:40px;height:40px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);font-size:20px}
.sheet .o{border-top:1px solid var(--line);padding:12px 0}
.sheet .o b{font:600 13px var(--mono)}
.sheet .o span{font-size:12.5px;color:var(--mut);margin-left:8px}
.sheet .o ul{list-style:none;margin-top:6px;font-size:14.5px}
.sheet .btn{width:100%;margin-top:14px}
.sheet .note{font-size:13px;color:var(--mut);margin-top:10px}
.snd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;background:#f0c7a6;color:#1f231b;border-radius:99px;padding:12px 18px;font-weight:800;font-size:14px;box-shadow:0 18px 30px -12px rgba(0,0,0,.6)}
</style>
</head>
<body data-mt="pedidos">
<div class="gate" id="gate">
  <form class="box" id="gf" aria-labelledby="gt">
    <img src="../img/logo-sm.png" alt="Higuera" width="110" height="40" style="height:40px;width:auto;margin:0 auto">
    <h1 id="gt">Pedidos y llamados</h1>
    <p>Pantalla para barra, cocina y meseros. Escribe el PIN del equipo.</p>
    <input type="password" class="in" id="pin" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="····" aria-label="PIN del equipo">
    <p class="err" id="gerr" role="alert"></p>
    <button class="btn btn-ink btn-block" type="submit">Entrar</button>
  </form>
</div>

<header class="bar">
  <img class="logo" src="../img/logo-sm.png" alt="Higuera" width="66" height="24">
  <h1>Pedidos y llamados</h1>
  <nav class="panels" aria-label="Paneles"><a href="../host/">Entrada</a><a href="./" class="cur" aria-current="page">Pedidos</a><a href="../club/">Club y mesas</a></nav>
  <div class="sp"></div>
  <span class="pill" id="modeP"></span>
  <div class="conn"><span class="dot off" id="cdot"></span><span id="ctxt">…</span></div>
</header>
<nav class="mtabs" aria-label="Secciones"><button type="button" class="on" data-mt="pedidos">Pedidos<b id="nP">0</b></button><button type="button" data-mt="llamados">Llamados<b id="nC">0</b></button><button type="button" data-mt="mesas">Mesas</button></nav>

<main class="lay">
  <div class="cols">
    <section class="col"><h2>Nuevos <b id="cN">0</b></h2><div class="zone" id="zN"></div></section>
    <section class="col"><h2>Preparando <b id="cP">0</b></h2><div class="zone" id="zP"></div></section>
    <section class="col"><h2>Listos para llevar <b id="cL">0</b></h2><div class="zone" id="zL"></div></section>
  </div>
  <aside class="side">
    <section class="box" id="bxCalls"><h2>Llamados <span id="cC"></span></h2><div id="calls"></div></section>
    <section class="box" id="bxMesas"><h2>Mesas <span>Toca para ver o cerrar</span></h2><div class="grid" id="tables"></div>
      <div class="legend"><span><i style="background:rgba(244,241,234,.12)"></i>Libre</span><span><i style="background:#4f5b41"></i>Con pedido</span><span><i style="background:#f0c7a6"></i>Llamando</span></div></section>
    <section class="box" id="bxStats"><h2>Hoy</h2><div class="stats" id="stats"></div></section>
  </aside>
</main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Mesa"></div></div>
<button class="snd hide" id="snd" type="button">Toca para activar el sonido de avisos</button>

<script src="../fila.js"></script>
<script>
(() => {
const { api, live, store, esc, ago, toast, beep, unlockAudio } = HG;
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
let pin = store.get("pin") || "", H = null, conn = null, seenO = null, seenC = null, sheetM = 0, closeArm = 0, audioOk = false;

async function login(p, silent) {
  try {
    const r = await api("/host/claim", { body: { pin: p } });
    if (r.created) { toast("PIN creado"); }
    pin = p; store.set("pin", p); $("#gate").classList.add("hide");
    H = r.state; paint(); start();
    if (silent && !audioOk) $("#snd").classList.remove("hide");
  } catch (e) { if (!silent) $("#gerr").textContent = e.message; store.set("pin", null); }
}
$("#gf").addEventListener("submit", (e) => { e.preventDefault(); unlockAudio(); audioOk = true; const p = $("#pin").value.replace(/\D/g, ""); if (p.length < 4) { $("#gerr").textContent = "Escribe al menos 4 números."; return; } login(p); });
$("#snd").onclick = () => { unlockAudio(); audioOk = true; $("#snd").classList.add("hide"); beep(1); };
function start() {
  conn && conn.stop();
  conn = live({ role: "host", pin, onData(d) { if (d.authError) { store.set("pin", null); location.reload(); return; } H = d; paint(); }, onStatus(s) { $("#cdot").className = "dot" + (s === "off" ? " off" : ""); $("#ctxt").textContent = s === "live" ? "En vivo" : s === "poll" ? "En línea" : "Reconectando"; } });
}

const mins = (t) => Math.floor((Date.now() - t) / 60000);
function tmCls(o) { const m = mins(o.t0); return o.status === "listo" ? (mins(o.tUpd) >= 4 ? "r" : "") : m >= 15 ? "r" : m >= 10 ? "w" : ""; }
function ticket(o, isNew) {
  const next = { nuevo: ["start", "Empezar", "btn-ink"], prep: ["ready", "Listo", "btn-ok"], listo: ["deliver", "Entregado", "btn-terra"] }[o.status];
  return `<article class="tk c-${o.status}${isNew ? " new" : ""}">
    <div class="hd"><span class="ms">Mesa ${o.m}<small>#${String(o.n).padStart(3, "0")}</small></span><span class="tm ${tmCls(o)}" data-t="${o.status === "listo" ? o.tUpd : o.t0}">${o.status === "listo" ? "listo " : ""}${ago(o.status === "listo" ? o.tUpd : o.t0)}</span></div>
    ${o.who ? `<div class="who">${o.member ? "Club · " : ""}${esc(o.who)}</div>` : ""}
    <ul>${o.items.map((it) => `<li><span class="q">${it.q}×</span><span>${esc(it.n)}${it.note ? `<i>${esc(it.note)}</i>` : ""}</span></li>`).join("")}</ul>
    ${o.note ? `<div class="gn">Nota: ${esc(o.note)}</div>` : ""}
    <div class="ac"><button class="btn ${next[2]}" type="button" data-o="${o.id}" data-a="${next[0]}">${next[1]}</button></div>
    <div class="sm">${o.status !== "nuevo" ? `<button type="button" data-o="${o.id}" data-a="back">Regresar</button>` : "<span></span>"}<button type="button" class="dg" data-o="${o.id}" data-a="cancel">Cancelar</button></div>
  </article>`;
}
function paint() {
  if (!H) return;
  const M = H.mesas;
  $("#modeP").textContent = !M.on ? "Pedidos en pausa" : M.mode === "pedir" ? "Piden desde la mesa" : "Solo llaman al mesero";
  $("#modeP").classList.toggle("on", M.on && M.mode === "pedir");
  const act = H.orders.filter((o) => !o.closed && ["nuevo", "prep", "listo"].includes(o.status));
  // sonido y animación para lo nuevo
  const firstPaint = seenO === null;
  const newO = act.filter((o) => o.status === "nuevo" && seenO && !seenO.has(o.id));
  const newC = H.calls.filter((c) => seenC && !seenC.has(c.id));
  if (!firstPaint && (newO.length || newC.length)) { beep(newC.length ? 3 : 2); if (newO.length) toast(`Nuevo pedido · Mesa ${newO[0].m}`); else toast(`Mesa ${newC[0].m}: ${newC[0].kind === "cuenta" ? "pide la cuenta" : "llama al mesero"}`); }
  seenO = new Set(H.orders.map((o) => o.id)); seenC = new Set(H.calls.map((c) => c.id));
  const by = (s) => act.filter((o) => o.status === s).sort((a, b) => a.t0 - b.t0);
  const fill = (id, list, empty) => { $(id).innerHTML = list.length ? list.map((o) => ticket(o, newO.includes(o))).join("") : `<div class="none">${empty}</div>`; };
  fill("#zN", by("nuevo"), "Sin pedidos nuevos");
  fill("#zP", by("prep"), "Nada en preparación");
  fill("#zL", by("listo"), "Nada esperando mesero");
  $("#cN").textContent = by("nuevo").length; $("#cP").textContent = by("prep").length; $("#cL").textContent = by("listo").length;
  $("#nP").textContent = act.length; $("#nC").textContent = H.calls.length;
  const calls = H.calls.slice().sort((a, b) => a.t0 - b.t0);
  $("#cC").textContent = calls.length ? calls.length + " abiertos" : "";
  $("#calls").innerHTML = calls.length ? calls.map((c) => `<div class="call ${c.kind}"><span class="m">${c.m}</span><span class="tx">${c.kind === "cuenta" ? "Pide la cuenta" : "Llama al mesero"}<small data-t="${c.t0}">hace ${ago(c.t0)}</small></span><button class="btn btn-ink" type="button" data-c="${c.id}">Atendido</button></div>`).join("") : `<div class="none">Ninguna mesa está llamando</div>`;
  $("#tables").innerHTML = H.tables.map((t) => { const al = t.mesero || t.cuenta; return `<button type="button" class="tb ${al ? "al" : t.orders ? "oc" : ""}" data-m="${t.m}" aria-label="Mesa ${t.m}"><b>${t.m}</b><small>${t.cuenta ? "Cuenta" : t.mesero ? "Llama" : t.pending ? t.pending + " en curso" : t.orders ? "Servida" : "Libre"}</small>${t.pending && !al ? '<span class="dt"></span>' : ""}</button>`; }).join("");
  const T = H.mesaToday;
  $("#stats").innerHTML = `<div><b>${T.orders}</b><small>Pedidos desde la mesa</small></div><div><b>${T.prepAvg ? T.prepAvg + "'" : "–"}</b><small>Tiempo promedio a "listo"</small></div><div><b>${T.calls}</b><small>Llamados</small></div><div><b>${T.callAvg ? T.callAvg + "'" : "–"}</b><small>Tiempo en atender</small></div>`;
  if (sheetM) tableSheet(sheetM);
}
function tableSheet(m) {
  sheetM = m;
  const os = H.orders.filter((o) => o.m === m && !o.closed);
  const cs = H.calls.filter((c) => c.m === m);
  const st = { nuevo: "Nuevo", prep: "Preparando", listo: "Listo", entregado: "Entregado", cancelado: "Cancelado" };
  $("#sheet").innerHTML = `<button class="x" type="button" id="sx" aria-label="Cerrar">×</button><h3>Mesa ${m}</h3>
    ${cs.length ? `<p class="note" style="color:var(--terra-d);font-weight:800">${cs.map((c) => (c.kind === "cuenta" ? "Pidió la cuenta" : "Llamó al mesero") + " hace " + ago(c.t0)).join(" · ")}</p>` : ""}
    ${os.length ? os.map((o) => `<div class="o"><b>#${String(o.n).padStart(3, "0")}</b><span>${st[o.status]} · hace ${ago(o.t0)}${o.who ? " · " + esc(o.who) : ""}</span><ul>${o.items.map((it) => `<li>${it.q} × ${esc(it.n)}${it.note ? " · " + esc(it.note) : ""}</li>`).join("")}</ul></div>`).join("") : `<p class="note">Sin pedidos abiertos en esta mesa.</p>`}
    <button class="btn ${closeArm === m ? "btn-terra" : "btn-ink"}" type="button" id="closeT">${closeArm === m ? "Toca otra vez para cerrar la mesa" : "Cerrar mesa (ya pagaron)"}</button>
    <p class="note">Al cerrar, la mesa queda libre y los próximos clientes que escaneen el QR empiezan desde cero.</p>`;
  $("#scrim").classList.add("on");
}
function closeSheet() { sheetM = 0; closeArm = 0; $("#scrim").classList.remove("on"); }

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) { if (e.target.id === "scrim") closeSheet(); return; }
  if (!audioOk) { unlockAudio(); audioOk = true; $("#snd").classList.add("hide"); }
  try {
    if (b.dataset.o) { H = await api("/host/order", { pin, body: { id: b.dataset.o, action: b.dataset.a } }); paint(); }
    else if (b.dataset.c) { H = await api("/host/call", { pin, body: { id: b.dataset.c } }); paint(); }
    else if (b.dataset.m) tableSheet(+b.dataset.m);
    else if (b.id === "sx") closeSheet();
    else if (b.id === "closeT") {
      if (closeArm !== sheetM) { closeArm = sheetM; tableSheet(sheetM); setTimeout(() => { if (closeArm) { closeArm = 0; if (sheetM) tableSheet(sheetM); } }, 4000); return; }
      const m = sheetM; H = await api("/host/table", { pin, body: { m, action: "close" } }); closeSheet(); paint(); toast(`Mesa ${m} cerrada`);
    }
    else if (b.dataset.mt) { document.body.dataset.mt = b.dataset.mt; $$(".mtabs button").forEach((x) => x.classList.toggle("on", x === b)); }
  } catch (x) { toast(x.message); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
setInterval(() => { $$("[data-t]").forEach((el) => { const t = +el.dataset.t; const pre = el.textContent.startsWith("listo") ? "listo " : el.textContent.startsWith("hace") ? "hace " : ""; el.textContent = pre + ago(t); }); }, 15000);
if (pin) login(pin, true);
})();
</script>
